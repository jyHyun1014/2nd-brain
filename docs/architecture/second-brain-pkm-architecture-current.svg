="282" font-size="14" font-weight="700" fill="#1f2937">11:00 compile-wiki</text><text x="946" y="306" font-size="13" font-weight="400" fill="#6b7280">agent + llm-wiki → branch</text><rect x="934" y="344" width="222" height="76" rx="8" fill="#ffffff" stroke="#7c3aed" stroke-width="1.2"/><text x="946" y="374" font-size="14" font-weight="700" fill="#1f2937">Guardrails</text><text x="946" y="398" font-size="13" font-weight="400" fill="#6b7280">deny push / merge / rm raw</text><rect x="934" y="436" width="222" height="76" rx="8" fill="#ffffff" stroke="#7c3aed" stroke-width="1.2"/><text x="946" y="466" font-size="14" font-weight="700" fill="#1f2937">Model provider</text><text x="946" y="490" font-size="13" font-weight="400" fill="#6b7280">OpenAI-compatible API</text><rect x="934" y="528" width="222" height="76" rx="8" fill="#ffffff" stroke="#7c3aed" stroke-width="1.2" stroke-dasharray="5 4"/><text x="946" y="558" font-size="14" font-weight="700" fill="#1f2937">Planned</text><text x="946" y="582" font-size="13" font-weight="400" fill="#6b7280">UA graph rebuild, review run</text><path d="M920,137 L892,137" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#a)"/><path d="M920,282 L892,282" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#a)"/><text x="30" y="680" font-size="13" font-weight="400" fill="#6b7280">Core assets are open formats (Markdown, YAML frontmatter, raw text + sha256) and Git history; every tool above is replaceable.</text></svg>