<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="580" viewBox="0 0 1200 580" font-family="'Segoe UI','Malgun Gothic',Arial,sans-serif"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker></defs><rect width="1200" height="580" fill="#ffffff"/><text x="30" y="42" font-size="24" font-weight="700" fill="#1f2937">2nd-Brain operating workflow (current, 2026-11)</text><rect x="30" y="80" width="172" height="175" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/><text x="42" y="106" font-size="12" font-weight="600" fill="#94a3b8">Manual</text><text x="42" y="126" font-size="16" font-weight="700" fill="#1f2937">Capture</text><text x="42" y="148" font-size="13" fill="#1f2937">Add paper to Zotero</text><text x="42" y="167" font-size="13" fill="#1f2937">&#x27;2nd-brain&#x27; collection</text><rect x="224" y="80" width="172" height="175" rx="10" fill="#eef6ff" stroke="#3b82f6" stroke-width="2"/><text x="236" y="106" font-size="12" font-weight="600" fill="#3b82f6">Daily 10:00 · Hermes script</text><text x="236" y="126" font-size="16" font-weight="700" fill="#1f2937">Gate A: collect</text><text x="236" y="148" font-size="13" fill="#1f2937">collect_evidence.py</text><text x="236" y="167" font-size="13" fill="#1f2937">→ raw/papers/ + sha256</text><text x="236" y="186" font-size="13" fill="#1f2937">validate_raw.py</text><text x="236" y="205" font-size="13" fill="#1f2937">candidates → inbox/</text><rect x="418" y="80" width="172" height="175" rx="10" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/><text x="430" y="106" font-size="12" font-weight="600" fill="#10b981">Daily 11:00 · Hermes agent</text><text x="430" y="126" font-size="16" font-weight="700" fill="#1f2937">Gate B: compile</text><text x="430" y="148" font-size="13" fill="#1f2937">Hermes agent + llm-wiki</text><text x="430" y="167" font-size="13" fill="#1f2937">→ wiki/compile-&lt;date&gt;</text><text x="430" y="186" font-size="13" fill="#1f2937">self-check vs raw/</text><text x="430" y="205" font-size="13" fill="#1f2937">lint_canonical.py</text><rect x="612" y="80" width="172" height="175" rx="10" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/><text x="624" y="106" font-size="12" font-weight="600" fill="#7c3aed">On request</text><text x="624" y="126" font-size="16" font-weight="700" fill="#1f2937">Review</text><text x="624" y="148" font-size="13" fill="#1f2937">Claude Code</text><text x="624" y="167" font-size="13" fill="#1f2937">review prompt (scripts/)</text><text x="624" y="186" font-size="13" fill="#1f2937">re-check every claim</text><text x="624" y="205" font-size="13" fill="#1f2937">report + recommendation</text><rect x="806" y="80" width="172" height="175" rx="10" fill="#fdf2f8" stroke="#db2777" stroke-width="2"/><text x="818" y="106" font-size="12" font-weight="600" fill="#db2777">Human-in-the-Loop</text><text x="818" y="126" font-size="16" font-weight="700" fill="#1f2937">Human decision</text><text x="818" y="148" font-size="13" fill="#1f2937">Approve → merge + push</text><text x="818" y="167" font-size="13" fill="#1f2937">Reject → discard branch</text><text x="818" y="186" font-size="13" fill="#1f2937">(user decides only)</text><rect x="1000" y="80" width="172" height="175" rx="10" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/><text x="1012" y="106" font-size="12" font-weight="600" fill="#10b981">Durable memory</text><text x="1012" y="126" font-size="16" font-weight="700" fill="#1f2937">Second Brain</text><text x="1012" y="148" font-size="13" fill="#1f2937">main branch:</text><text x="1012" y="167" font-size="13" fill="#1f2937">canonical pages,</text><text x="1012" y="186" font-size="13" fill="#1f2937">index.md, log.md</text><path d="M202,167.5 L222,167.5" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#a)"/><path d="M396,167.5 L416,167.5" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#a)"/><path d="M590,167.5 L610,167.5" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#a)"/><path d="M784,167.5 L804,167.5" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#a)"/><path d="M978,167.5 L998,167.5" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#a)"/><rect x="418" y="330" width="172" height="115" rx="10" fill="#fff7ed" stroke="#f59e0b" stroke-width="2"/><text x="430" y="356" font-size="16" font-weight="700" fill="#1f2937">New knowledge</text><text x="430" y="378" font-size="13" fill="#1f2937">candidates</text><text x="430" y="397" font-size="13" fill="#1f2937">(hypotheses only)</text><rect x="612" y="330" width="172" height="115" rx="10" fill="#fff7ed" stroke="#f59e0b" stroke-width="2"/><text x="624" y="356" font-size="16" font-weight="700" fill="#1f2937">NotebookLM</text><text x="624" y="378" font-size="13" fill="#1f2937">Q&amp;A over raw/</text><text x="624" y="397" font-size="13" fill="#1f2937">paper records</text><rect x="806" y="330" width="172" height="115" rx="10" fill="#fff7ed" stroke="#f59e0b" stroke-width="2"/><text x="818" y="356" font-size="16" font-weight="700" fill="#1f2937">UA graph</text><text x="818" y="378" font-size="13" fill="#1f2937">Understand Anything,</text><text x="818" y="397" font-size="13" fill="#1f2937">from canonical pages</text><rect x="1000" y="330" width="172" height="115" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/><text x="1012" y="356" font-size="16" font-weight="700" fill="#1f2937">Obsidian</text><text x="1012" y="378" font-size="13" fill="#1f2937">read, edit,</text><text x="1012" y="397" font-size="13" fill="#1f2937">graph view</text><path d="M1086.0,255 L1086.0,328" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#a)"/><path d="M1000,387 L980,387" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#a)"/><path d="M612,387 L592,387" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#a)"/><path d="M892.0,445 L892.0,470 L504.0,470 L504.0,447" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#a)"/><path d="M504.0,330 L504.0,290 L698.0,290 L698.0,257" fill="none" stroke="#475569" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#a)"/><text x="512.0" y="282" font-size="13" font-weight="400" fill="#6b7280">verify against raw/ first</text><text x="30" y="530" font-size="13" font-weight="400" fill="#1f2937">Rules: raw/ bodies are immutable · every claim traces to raw/ · discovery output is never evidence · nothing reaches main without the user&#x27;s decision</text><text x="30" y="554" font-size="13" font-weight="400" fill="#6b7280">Hermes runs locally; its model provider and API keys live in the Hermes data directory, never in this repository. Not yet automated: graph rebuild, review step.</text></svg>